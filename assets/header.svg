<svg xmlns="http://www.w3.org/2000/svg" width="900" height="260" viewBox="0 0 900 260">
  <defs>
    <!-- background grid -->
    <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M28 0H0V28" fill="none" stroke="#ffffff" stroke-opacity="0.04"/>
    </pattern>
    <radialGradient id="glowA" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#7c3aed" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#7c3aed" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowB" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="nameGrad" x1="0" x2="1">
      <stop offset="0%" stop-color="#f5f5f5"/>
      <stop offset="100%" stop-color="#a5b4fc"/>
    </linearGradient>
    <linearGradient id="line" x1="0" x2="1">
      <stop offset="0%" stop-color="#7c3aed"/>
      <stop offset="50%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#7c3aed"/>
    </linearGradient>
    <clipPath id="card"><rect width="900" height="260" rx="18"/></clipPath>
    <style>
      .mono { font-family: 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace; }
      .sans { font-family: -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif; }
      .floatA { animation: floatA 9s ease-in-out infinite; }
      .floatB { animation: floatB 11s ease-in-out infinite; }
      .fade1 { opacity: 0; animation: up .8s ease-out .2s forwards; }
      .fade2 { opacity: 0; animation: up .8s ease-out .5s forwards; }
      .fade3 { opacity: 0; animation: up .8s ease-out .8s forwards; }
      .cursor { animation: blink 1s steps(1) infinite; }
      .pulse { animation: pulse 2s ease-out infinite; transform-origin: 66px 214px; }
      .shine { animation: shine 6s linear infinite; }
      @keyframes floatA { 0%,100% { transform: translate(0,0); } 50% { transform: translate(60px,25px); } }
      @keyframes floatB { 0%,100% { transform: translate(0,0); } 50% { transform: translate(-70px,-20px); } }
      @keyframes up { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
      @keyframes blink { 50% { opacity: 0; } }
      @keyframes pulse { 0% { opacity: .7; transform: scale(1); } 100% { opacity: 0; transform: scale(2.6); } }
      @keyframes shine { from { transform: translateX(-900px); } to { transform: translateX(900px); } }
    </style>
  </defs>

  <g clip-path="url(#card)">
    <rect width="900" height="260" fill="#0b0f17"/>
    <rect width="900" height="260" fill="url(#grid)"/>
    <circle class="floatA" cx="720" cy="40" r="210" fill="url(#glowA)"/>
    <circle class="floatB" cx="820" cy="230" r="170" fill="url(#glowB)"/>

    <!-- terminal dots -->
    <circle cx="40" cy="36" r="6" fill="#ff5f57"/>
    <circle cx="60" cy="36" r="6" fill="#febc2e"/>
    <circle cx="80" cy="36" r="6" fill="#28c840"/>
    <text x="110" y="41" class="mono" font-size="13" fill="#6b7280">~/oshadha</text>

    <g class="fade1">
      <text x="40" y="110" class="mono" font-size="15" fill="#7dd3fc">$ whoami</text>
      <text x="40" y="152" class="sans" font-size="44" font-weight="700" fill="url(#nameGrad)">Oshadha Vimukthi</text>
    </g>
    <g class="fade2">
      <text x="40" y="184" class="mono" font-size="16" fill="#9ca3af">Full-Stack AI Engineer · Colombo, Sri Lanka<tspan class="cursor" fill="#a5b4fc"> ▍</tspan></text>
    </g>
    <g class="fade3">
      <circle class="pulse" cx="66" cy="214" r="5" fill="#22c55e"/>
      <circle cx="66" cy="214" r="5" fill="#22c55e"/>
      <rect x="54" y="202" width="300" height="24" rx="12" fill="#22c55e" fill-opacity="0.08" stroke="#22c55e" stroke-opacity="0.35"/>
      <text x="80" y="219" class="sans" font-size="13" fill="#86efac">Open to graduate roles and internships</text>
    </g>

    <!-- bottom accent line -->
    <rect y="256" width="900" height="4" fill="url(#line)"/>
    <rect class="shine" y="256" width="240" height="4" fill="#ffffff" fill-opacity="0.6"/>
  </g>
  <rect x="0.5" y="0.5" width="899" height="259" rx="18" fill="none" stroke="#ffffff" stroke-opacity="0.08"/>
</svg>
